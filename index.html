<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Ali Sadeghi's interactive portfolio and resume website."
        />
        <meta name="theme-color" content="#0a0a0a" />
        <link
            rel="preload"
            href="/fonts/Vazirmatn-Light.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <script>
            (function () {
                const hostname = window.location.hostname;

                const websites = {
                    localhost: "3d04af0b-cd6f-4e05-91aa-0bf401a2c02a",
                    "ali-sdg.is-a.dev": "3d04af0b-cd6f-4e05-91aa-0bf401a2c02a",
                };

                const websiteId = websites[hostname];

                if (!websiteId) return;

                const script = document.createElement("script");
                script.defer = true;
                script.src = "https://cloud.umami.is/script.js";
                script.setAttribute("data-website-id", websiteId);
                script.setAttribute("data-domains", hostname);

                document.head.appendChild(script);
            })();
        </script>
        <title>Ali Sadeghi | Portfolio</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
